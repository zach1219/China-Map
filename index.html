<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国地图可视化工具</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="header">
    <h1>🇨🇳 中国地图可视化工具</h1>
    <p>输入文本自动匹配省份全称和简称 · 零依赖离线可用</p>
</div>
<div class="container">
    <div class="map-panel">
        <svg id="china-map" viewBox="80 100 480 400" xmlns="http://www.w3.org/2000/svg">
            <g id="outer-border-group"></g>
            <g id="provinces-group"></g>
            <g id="labels-group"></g>
        </svg>
    </div>
    <div class="right-panel">
        <div class="card">
            <h3>📝 文本输入</h3>
            <textarea id="text-input" placeholder="粘贴文本，自动匹配省份全称和简称……"></textarea>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="processText()">开始分析</button>
                <button class="btn btn-success" onclick="clearAll()">清除</button>
            </div>
        </div>
        <div class="card">
            <h3>🎨 颜色配置</h3>
            <div class="color-row">
                <label>最低频次</label>
                <input type="color" id="min-color" value="#ffffcc">
            </div>
            <div class="color-row">
                <label>最高频次</label>
                <input type="color" id="max-color" value="#800020">
            </div>
            <div class="color-row">
                <label>边界颜色</label>
                <input type="color" id="border-color" value="#999999">
            </div>
            <div class="gradient-bar" id="gradient-bar"></div>
            <div class="color-row" style="margin-top:8px">
                <label>边界粗细</label>
                <input type="range" id="stroke-width-slider" min="0.2" max="3" step="0.1" value="0.5" style="flex:1;accent-color:var(--primary)">
                <span id="stroke-width-val" style="font-size:12px;color:var(--text-secondary);min-width:28px;text-align:right">0.5</span>
            </div>
            <div class="color-row" style="margin-top:8px">
                <label>名称大小</label>
                <input type="range" id="label-size" min="4" max="16" value="6" style="flex:1;accent-color:var(--primary)">
                <span id="label-size-val" style="font-size:12px;color:var(--text-secondary);min-width:28px;text-align:right">6px</span>
            </div>
            <div class="color-row" style="margin-top:4px">
                <label style="cursor:pointer"><input type="checkbox" id="hide-labels" checked style="vertical-align:middle;margin-right:4px">仅显示有数据省份名称</label>
            </div>
            <div class="color-row" style="margin-top:4px">
                <label style="cursor:pointer"><input type="checkbox" id="show-count" style="vertical-align:middle;margin-right:4px">省份名称后显示频次</label>
            </div>
        </div>
        <div class="card">
            <h3>📊 统计信息</h3>
            <div class="stats-grid">
                <div class="stat-item"><div class="stat-value" id="stat-total">0</div><div class="stat-label">总匹配数</div></div>
                <div class="stat-item"><div class="stat-value" id="stat-provinces">0</div><div class="stat-label">匹配省份</div></div>
                <div class="stat-item"><div class="stat-value" id="stat-max">0</div><div class="stat-label">最高频次</div></div>
            </div>
            <div id="stats-table-wrap"></div>
        </div>
        <div class="card">
            <h3>💾 导出</h3>
            <div class="export-group">
                <button class="btn btn-info" onclick="exportSVG()">导出 SVG</button>
                <button class="btn btn-info" onclick="exportPNG(2)">PNG 2x</button>
                <button class="btn btn-info" onclick="exportPNG(3)">PNG 3x</button>
                <button class="btn btn-info" onclick="exportPNG(2,true)">PNG 透明</button>
            </div>
        </div>
    </div>
</div>
<div id="tooltip"></div>
<footer id="site-footer">
    <span>累计使用 <strong id="ft-uses">0</strong> 次</span>
    <span class="sep">|</span>
    <span>最常出现：<strong id="ft-top">-</strong></span>
    <span class="sep">|</span>
    <a href="https://github.com/zach1219/China-Map" target="_blank">GitHub 项目地址</a>
    <span class="sep">|</span>
    <span>v1.0.0</span>
</footer>



<script src="js/provinces.js"></script>
<script src="js/map.js"></script>
<script src="js/export.js"></script>
</body>
</html>
